server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets and media can be cached aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /storage/ {
        expires 7d;
        try_files $uri =404;
    }

    # SPA fallback so routes like /project/5 work on reload
    location / {
        try_files $uri $uri/ /index.html;
    }
}
